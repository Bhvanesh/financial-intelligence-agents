name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Run tests ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          OPENAI_MODEL: "gpt-4o-mini"
          OPENAI_API_KEY: "test-key"
          LANGCHAIN_TRACING_V2: "false"
          LANGCHAIN_API_KEY: ""
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          REDIS_DB: "0"
        run: pytest tests/ -v

  # ── Job 2: Build and push Docker image to ECR ───────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: test          # only runs if tests pass
    if: github.ref == 'refs/heads/main'   # only on main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/financial-intelligence-agents:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/financial-intelligence-agents:latest .
          docker push $ECR_REGISTRY/financial-intelligence-agents:$IMAGE_TAG
          docker push $ECR_REGISTRY/financial-intelligence-agents:latest
          echo "IMAGE=$ECR_REGISTRY/financial-intelligence-agents:latest" >> $GITHUB_ENV

      - name: Summary
        run: |
          echo "✅ Docker image pushed to ECR"
          echo "Image: ${{ env.IMAGE }}"